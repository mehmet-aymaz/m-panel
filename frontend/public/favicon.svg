<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Shield Border Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />  <!-- Cyan -->
      <stop offset="50%" stop-color="#8b5cf6" />  <!-- Purple -->
      <stop offset="100%" stop-color="#ec4899" /> <!-- Pink -->
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle/Shield Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Shield Shape -->
  <path d="M256,64 C350,64 400,100 400,100 C400,100 400,280 370,360 C330,460 256,480 256,480 C256,480 182,460 142,360 C112,280 112,100 112,100 C112,100 162,64 256,64 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="24" 
        filter="url(#glow)" />

  <!-- Inner VPN Node / Shield core -->
  <path d="M256,100 C320,100 360,130 360,130 C360,130 360,260 336,325 C305,405 256,430 256,430 C256,430 207,405 176,325 C152,260 152,130 152,130 C152,130 192,100 256,100 Z" 
        fill="rgba(139, 92, 246, 0.15)" />

  <!-- Letter 'M' in the Center with VPN Bolt design -->
  <path d="M190,320 L190,180 L230,180 L256,230 L282,180 L322,180 L322,320 L292,320 L292,230 L256,300 L220,230 L220,320 Z" 
        fill="#06b6d4" 
        filter="url(#glow)" />
</svg>